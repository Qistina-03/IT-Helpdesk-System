<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <h1>IT Helpdesk - Admin Dashboard</h1>

        <button id="logoutButton">
            Logout
        </button>

    </header>


    <main>

        <h2>All Tickets</h2>


        <!-- SEARCH -->

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tickets..."
            >


            <!-- STATUS FILTER -->

            <select id="statusFilter">

                <option value="All">
                    All Status
                </option>

                <option value="Open">
                    Open
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Resolved">
                    Resolved
                </option>

                <option value="Closed">
                    Closed
                </option>

            </select>


            <!-- PRIORITY FILTER -->

            <select id="priorityFilter">

                <option value="All">
                    All Priority
                </option>

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

                <option value="Critical">
                    Critical
                </option>

            </select>

        </div>


        <!-- TICKET TABLE -->

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Priority</th>

                    <th>Status</th>

                    <th>Created By</th>

                    <th>Assigned To</th>

                    <th>Action</th>

                    <th>Created At</th>

                </tr>

            </thead>


            <tbody id="ticketTableBody">

            </tbody>

        </table>

    </main>


    <script src="js/admin-dashboard.js"></script>

</body>

</html>
